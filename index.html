<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biofeedback Vocal - CPPS Continuo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .btn-settings {
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* ÁREA PRINCIPAL DEL CIRCULO DE BIOFEEDBACK */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .visualizer-container {
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .target-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 2px dashed #334155;
            border-radius: 50%;
            pointer-events: none;
        }

        .feedback-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ef4444; /* Rojo inicial */
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            transition: width 0.1s ease-out, height 0.1s ease-out, background-color 0.1s ease-out, box-shadow 0.1s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ETIQUETA DE ESTADO PROGRESIVO */
        .status-container {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ef4444;
            transition: color 0.15s ease;
        }

        .progress-bar-bg {
            width: 80%;
            height: 12px;
            background-color: #334155;
            border-radius: 6px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #ef4444;
            border-radius: 6px;
            transition: width 0.1s ease-out, background-color 0.1s ease-out;
        }

        /* CONTROLES INFERIORES */
        footer {
            width: 100%;
            max-width: 500px;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            background-color: #22c55e;
            color: #000;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-main.active {
            background-color: #ef4444;
            color: #fff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }

        /* PANEL DE AJUSTES CLÍNICOS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 450px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .modal h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .setting-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .val-display {
            font-weight: bold;
            color: var(--text-main);
            float: right;
        }

        .live-monitor {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .btn-close {
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Biofeedback de Voz</h1>
        <button class="btn-settings" id="btnSettings">⚙️ Ajustes</button>
    </header>

    <main>
        <div class="visualizer-container">
            <div class="target-ring"></div>
            <div class="feedback-circle" id="circle"></div>
        </div>

        <div class="status-container">
            <div class="status-text" id="statusText">Inicie el ejercicio</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </main>

    <footer>
        <button class="btn-main" id="btnStart">INICIAR EJERCICIO</button>
    </footer>

    <!-- MODAL DE AJUSTES CLÍNICOS -->
    <div class="modal" id="modalSettings">
        <div class="modal-content">
            <h2>Ajustes de Calibración</h2>
            
            <div class="live-monitor">
                CPPS Bruto: <span id="cppsLiveVal">0.0</span> dB<br>
                Nivel Fluidez: <span id="smoothPercentVal">0</span>%
            </div>

            <div class="setting-group">
                <label>Umbral Constricción (Rojo) <span class="val-display" id="minCppsVal">5.0 dB</span></label>
                <input type="range" id="sliderMinCpps" min="1.0" max="15.0" step="0.5" value="5.0">
            </div>

            <div class="setting-group">
                <label>Umbral Fluidez Meta (Verde) <span class="val-display" id="maxCppsVal">16.0 dB</span></label>
                <input type="range" id="sliderMaxCpps" min="10.0" max="25.0" step="0.5" value="16.0">
            </div>

            <div class="setting-group">
                <label>Puerta de Ruido / Sensibilidad <span class="val-display" id="gateVal">-40 dB</span></label>
                <input type="range" id="sliderGate" min="-60" max="-20" step="2" value="-40">
            </div>

            <button class="btn-close" id="btnCloseSettings">Guardar y Cerrar</button>
        </div>
    </div>

    <script>
        // --- ESTADO DE LA APLICACIÓN ---
        let audioCtx, analyser, micStream;
        let isRunning = false;

        // Umbrales clínicos por defecto (ajustables en el panel)
        let minCPPS = 5.0;   // Debajo de este valor = 0% fluidez (Totalmente rojo)
        let maxCPPS = 16.0;  // Encima de este valor = 100% fluidez (Totalmente verde)
        let noiseGateDb = -40;

        // Suavizado temporal de valores
        let currentFluencySmooth = 0;

        // Elementos DOM
        const btnStart = document.getElementById('btnStart');
        const btnSettings = document.getElementById('btnSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const modalSettings = document.getElementById('modalSettings');
        const circle = document.getElementById('circle');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');

        const sliderMinCpps = document.getElementById('sliderMinCpps');
        const sliderMaxCpps = document.getElementById('sliderMaxCpps');
        const sliderGate = document.getElementById('sliderGate');
        const minCppsVal = document.getElementById('minCppsVal');
        const maxCppsVal = document.getElementById('maxCppsVal');
        const gateVal = document.getElementById('gateVal');
        const cppsLiveVal = document.getElementById('cppsLiveVal');
        const smoothPercentVal = document.getElementById('smoothPercentVal');

        // --- MANEJO DE EVENTOS ---
        btnStart.addEventListener('click', toggleAudio);
        btnSettings.addEventListener('click', () => modalSettings.style.display = 'block');
        btnCloseSettings.addEventListener('click', () => modalSettings.style.display = 'none');

        sliderMinCpps.addEventListener('input', (e) => {
            minCPPS = parseFloat(e.target.value);
            minCppsVal.textContent = minCPPS.toFixed(1) + ' dB';
        });

        sliderMaxCpps.addEventListener('input', (e) => {
            maxCPPS = parseFloat(e.target.value);
            maxCppsVal.textContent = maxCPPS.toFixed(1) + ' dB';
        });

        sliderGate.addEventListener('input', (e) => {
            noiseGateDb = parseInt(e.target.value);
            gateVal.textContent = noiseGateDb + ' dB';
        });

        // --- CONTROL DE AUDIO ---
        async function toggleAudio() {
            if (isRunning) {
                stopAudio();
            } else {
                await startAudio();
            }
        }

        async function startAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });

                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Alta resolución espectral
                analyser.smoothingTimeConstant = 0.3;
                source.connect(analyser);

                isRunning = true;
                btnStart.textContent = "DETENER EJERCICIO";
                btnStart.classList.add('active');
                
                processLoop();
            } catch (err) {
                alert("Error al acceder al micrófono: " + err.message);
            }
        }

        function stopAudio() {
            isRunning = false;
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();

            btnStart.textContent = "INICIAR EJERCICIO";
            btnStart.classList.remove('active');
            statusText.textContent = "Ejercicio en pausa";
            statusText.style.color = "#94a3b8";
            resetVisuals();
        }

        function resetVisuals() {
            circle.style.width = '80px';
            circle.style.height = '80px';
            circle.style.backgroundColor = '#ef4444';
            circle.style.boxShadow = '0 0 20px rgba(239, 68, 68, 0.4)';
            progressBar.style.width = '0%';
            progressBar.style.backgroundColor = '#ef4444';
        }

        // --- ALGORITMO DE CÁLCULO CEPSTRAL (CPPS OPTIMIZADO) ---
        function processLoop() {
            if (!isRunning) return;

            const bufferLength = analyser.fftSize;
            const timeData = new Float32Array(bufferLength);
            analyser.getFloatTimeDomainData(timeData);

            // 1. Calcular volumen RMS para Puerta de Ruido
            let sumSq = 0;
            for (let i = 0; i < bufferLength; i++) {
                sumSq += timeData[i] * timeData[i];
            }
            const rms = Math.sqrt(sumSq / bufferLength);
            const db = 20 * Math.log10(Math.max(rms, 0.00001));

            if (db < noiseGateDb) {
                // Silencio / Ruido ambiente
                currentFluencySmooth += (0 - currentFluencySmooth) * 0.1;
                updateVisuals(0, 0);
                requestAnimationFrame(processLoop);
                return;
            }

            // 2. Transformada de Fourier (Espectro de Frecuencia)
            const freqData = new Float32Array(bufferLength / 2);
            analyser.getFloatFrequencyData(freqData);

            // 3. Espectro Logarítmico para Cepstrum
            const logSpec = new Float32Array(freqData.length);
            for (let i = 0; i < freqData.length; i++) {
                // Normalización y ajuste de sensibilidad
                logSpec[i] = Math.max(freqData[i], -100);
            }

            // 4. Transformada Inversa aproximada (Autocorrelación del espectro logarítmico = Quefrencia)
            const quefrencyLength = logSpec.length;
            const cepstrum = new Float32Array(quefrencyLength);

            for (let q = 0; q < quefrencyLength; q++) {
                let sum = 0;
                for (let k = 0; k < quefrencyLength; k += 2) {
                    sum += logSpec[k] * Math.cos((2 * Math.PI * k * q) / quefrencyLength);
                }
                cepstrum[q] = sum / quefrencyLength;
            }

            // 5. Buscar Pico Cepstral en rango de F0 (60 Hz a 350 Hz -> Quefrencia adecuada)
            const sampleRate = audioCtx.sampleRate;
            const minQuef = Math.floor(sampleRate / 350); // F0 máx
            const maxQuef = Math.floor(sampleRate / 60);  // F0 mín

            let maxPeakVal = -Infinity;
            let peakQuef = 0;

            for (let q = minQuef; q <= maxQuef && q < quefrencyLength; q++) {
                if (cepstrum[q] > maxPeakVal) {
                    maxPeakVal = cepstrum[q];
                    peakQuef = q;
                }
            }

            // 6. Línea de Tendencia Base (Regresión Lineal Simplificada)
            let sumBase = 0;
            let countBase = 0;
            for (let q = minQuef; q <= maxQuef && q < quefrencyLength; q++) {
                sumBase += cepstrum[q];
                countBase++;
            }
            const avgBase = sumBase / countBase;

            // Prominencia del Pico Cepstral (CPPS Estimado)
            let rawCPPS = Math.max(0, (maxPeakVal - avgBase) * 2.5);

            // 7. Mapeo Progresivo Continuo (Sigmoide Suave)
            let fluencyRatio = (rawCPPS - minCPPS) / (maxCPPS - minCPPS);
            fluencyRatio = Math.max(0, Math.min(1, fluencyRatio)); // Acotar entre 0.0 y 1.0

            // Suavizado temporal continuo para evitar cambios bruscos
            currentFluencySmooth += (fluencyRatio - currentFluencySmooth) * 0.15;

            // Actualizar interfaz
            cppsLiveVal.textContent = rawCPPS.toFixed(1);
            updateVisuals(currentFluencySmooth, rawCPPS);

            requestAnimationFrame(processLoop);
        }

        // --- ACTUALIZACIÓN DE INTERFAZ GRÁFICA CONTINUA ---
        function updateVisuals(fluency, rawCpps) {
            const percent = Math.round(fluency * 100);
            smoothPercentVal.textContent = percent;

            // A. TAMAÑO CONTINUO (De 80px a 250px)
            const minSize = 80;
            const maxSize = 250;
            const currentSize = minSize + (maxSize - minSize) * fluency;
            circle.style.width = currentSize + 'px';
            circle.style.height = currentSize + 'px';

            // B. COLOR CONTINUO (Modelo HSL: 0° Rojo -> 60° Amarillo -> 120° Verde)
            const hue = fluency * 120; // 0 = Rojo puro, 60 = Amarillo, 120 = Verde puro
            const colorHSL = `hsl(${hue}, 85%, 50%)`;
            const shadowHSL = `rgba(${hue < 60 ? 239 : 34}, ${hue > 60 ? 197 : 68}, 68, 0.4)`;

            circle.style.backgroundColor = colorHSL;
            circle.style.boxShadow = `0 0 ${20 + fluency * 25}px ${shadowHSL}`;

            // C. BARRA DE PROGRESO Y TEXTOS DE ESTADO CONTINUOS
            progressBar.style.width = percent + '%';
            progressBar.style.backgroundColor = colorHSL;

            statusText.style.color = colorHSL;

            if (percent < 25) {
                statusText.textContent = "Voz Muy Constreñida (" + percent + "%)";
            } else if (percent < 55) {
                statusText.textContent = "Tensión Moderada (" + percent + "%)";
            } else if (percent < 80) {
                statusText.textContent = "Emisión Aceptable (" + percent + "%)";
            } else {
                statusText.textContent = "Voz Muy Fluida (" + percent + "%)";
            }
        }
    </script>
</body>
</html>
