<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biofeedback Vocal - HNR de Alta Calidad</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .btn-settings {
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .visualizer-container {
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .target-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 2px dashed #334155;
            border-radius: 50%;
            pointer-events: none;
        }

        .feedback-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            transition: width 0.08s ease-out, height 0.08s ease-out, background-color 0.08s ease-out, box-shadow 0.08s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-container {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }

        .status-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ef4444;
            transition: color 0.15s ease;
        }

        .progress-bar-bg {
            width: 80%;
            height: 12px;
            background-color: #334155;
            border-radius: 6px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #ef4444;
            border-radius: 6px;
            transition: width 0.08s ease-out, background-color 0.08s ease-out;
        }

        footer {
            width: 100%;
            max-width: 500px;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            background-color: #22c55e;
            color: #000;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-main.active {
            background-color: #ef4444;
            color: #fff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 450px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .modal h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .setting-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .val-display {
            font-weight: bold;
            color: var(--text-main);
            float: right;
        }

        .live-monitor {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .btn-close {
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Biofeedback de Voz</h1>
        <button class="btn-settings" id="btnSettings">⚙️ Ajustes</button>
    </header>

    <main>
        <div class="visualizer-container">
            <div class="target-ring"></div>
            <div class="feedback-circle" id="circle"></div>
        </div>

        <div class="status-container">
            <div class="status-text" id="statusText">Inicie el ejercicio</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </main>

    <footer>
        <button class="btn-main" id="btnStart">INICIAR EJERCICIO</button>
    </footer>

    <div class="modal" id="modalSettings">
        <div class="modal-content">
            <h2>Ajustes de Calibración</h2>
            
            <div class="live-monitor">
                Indice Armónico (HNR): <span id="hnrLiveVal">0.0</span> dB<br>
                Nivel Fluidez: <span id="smoothPercentVal">0</span>%
            </div>

            <div class="setting-group">
                <label>Umbral Constricción (Rojo) <span class="val-display" id="minHnrVal">3.0 dB</span></label>
                <input type="range" id="sliderMinHnr" min="0.0" max="12.0" step="0.5" value="3.0">
            </div>

            <div class="setting-group">
                <label>Umbral Fluidez Meta (Verde) <span class="val-display" id="maxHnrVal">15.0 dB</span></label>
                <input type="range" id="sliderMaxHnr" min="8.0" max="25.0" step="0.5" value="15.0">
            </div>

            <div class="setting-group">
                <label>Puerta de Ruido / Sensibilidad <span class="val-display" id="gateVal">-45 dB</span></label>
                <input type="range" id="sliderGate" min="-60" max="-20" step="1" value="-45">
            </div>

            <button class="btn-close" id="btnCloseSettings">Guardar y Cerrar</button>
        </div>
    </div>

    <script>
        let audioCtx, analyser, micStream;
        let isRunning = false;

        // Umbrales de HNR (Harmonics-to-Noise Ratio)
        let minHNR = 3.0;   // Voz constreñida/ruidosa
        let maxHNR = 15.0;  // Voz armónica/fluida
        let noiseGateDb = -45;

        let currentFluencySmooth = 0;

        const btnStart = document.getElementById('btnStart');
        const btnSettings = document.getElementById('btnSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const modalSettings = document.getElementById('modalSettings');
        const circle = document.getElementById('circle');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');

        const sliderMinHnr = document.getElementById('sliderMinHnr');
        const sliderMaxHnr = document.getElementById('sliderMaxHnr');
        const sliderGate = document.getElementById('sliderGate');
        const minHnrVal = document.getElementById('minHnrVal');
        const maxHnrVal = document.getElementById('maxHnrVal');
        const gateVal = document.getElementById('gateVal');
        const hnrLiveVal = document.getElementById('hnrLiveVal');
        const smoothPercentVal = document.getElementById('smoothPercentVal');

        btnStart.addEventListener('click', toggleAudio);
        btnSettings.addEventListener('click', () => modalSettings.style.display = 'block');
        btnCloseSettings.addEventListener('click', () => modalSettings.style.display = 'none');

        sliderMinHnr.addEventListener('input', (e) => {
            minHNR = parseFloat(e.target.value);
            minHnrVal.textContent = minHNR.toFixed(1) + ' dB';
        });

        sliderMaxHnr.addEventListener('input', (e) => {
            maxHNR = parseFloat(e.target.value);
            maxHnrVal.textContent = maxHNR.toFixed(1) + ' dB';
        });

        sliderGate.addEventListener('input', (e) => {
            noiseGateDb = parseInt(e.target.value);
            gateVal.textContent = noiseGateDb + ' dB';
        });

        async function toggleAudio() {
            if (isRunning) {
                stopAudio();
            } else {
                await startAudio();
            }
        }

        async function startAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });

                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.2;
                source.connect(analyser);

                isRunning = true;
                btnStart.textContent = "DETENER EJERCICIO";
                btnStart.classList.add('active');
                
                processLoop();
            } catch (err) {
                alert("Error al acceder al micrófono: " + err.message);
            }
        }

        function stopAudio() {
            isRunning = false;
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();

            btnStart.textContent = "INICIAR EJERCICIO";
            btnStart.classList.remove('active');
            statusText.textContent = "Ejercicio en pausa";
            statusText.style.color = "#94a3b8";
            resetVisuals();
        }

        function resetVisuals() {
            circle.style.width = '80px';
            circle.style.height = '80px';
            circle.style.backgroundColor = '#ef4444';
            circle.style.boxShadow = '0 0 20px rgba(239, 68, 68, 0.4)';
            progressBar.style.width = '0%';
            progressBar.style.backgroundColor = '#ef4444';
        }

        // --- MOTOR HNR POR AUTOCORRELACIÓN TIEMPO-FRECUENCIA ---
        function processLoop() {
            if (!isRunning) return;

            const bufferLength = analyser.fftSize;
            const timeData = new Float32Array(bufferLength);
            analyser.getFloatTimeDomainData(timeData);

            // 1. Detección de volumen RMS
            let sumSq = 0;
            for (let i = 0; i < bufferLength; i++) {
                sumSq += timeData[i] * timeData[i];
            }
            const rms = Math.sqrt(sumSq / bufferLength);
            const db = 20 * Math.log10(Math.max(rms, 0.00001));

            if (db < noiseGateDb) {
                currentFluencySmooth += (0 - currentFluencySmooth) * 0.15;
                updateVisuals(currentFluencySmooth, 0);
                requestAnimationFrame(processLoop);
                return;
            }

            // 2. Autocorrelación Pura para medir Periodicidad vs Aperiodicidad
            const nSamples = timeData.length;
            const sampleRate = audioCtx.sampleRate;
            const minLag = Math.floor(sampleRate / 350); // F0 Max 350Hz
            const maxLag = Math.floor(sampleRate / 70);  // F0 Min 70Hz

            let maxCorr = -1;

            // Normalización de energía r0
            let r0 = 0;
            for (let i = 0; i < nSamples; i++) {
                r0 += timeData[i] * timeData[i];
            }

            if (r0 > 0.00001) {
                for (let lag = minLag; lag <= maxLag; lag++) {
                    let rLag = 0;
                    for (let i = 0; i < nSamples - lag; i++) {
                        rLag += timeData[i] * timeData[i + lag];
                    }
                    const normCorr = rLag / r0;
                    if (normCorr > maxCorr) {
                        maxCorr = normCorr;
                    }
                }
            }

            // Clave: R_max mide directamente la energía armónica pura
            // Voz fluida: maxCorr cercano a 0.85 - 0.98
            // Voz constreñida/estrangulada: maxCorr cae por debajo de 0.50
            let hnrDb = 0;
            if (maxCorr > 0.1 && maxCorr < 0.999) {
                hnrDb = 10 * Math.log10(maxCorr / (1 - maxCorr));
            } else if (maxCorr >= 0.999) {
                hnrDb = 25.0;
            }

            hnrDb = Math.max(0, hnrDb);

            // 3. Mapeo a Fluidez
            let fluencyRatio = (hnrDb - minHNR) / (maxHNR - minHNR);
            fluencyRatio = Math.max(0, Math.min(1, fluencyRatio));

            currentFluencySmooth += (fluencyRatio - currentFluencySmooth) * 0.2;

            hnrLiveVal.textContent = hnrDb.toFixed(1);
            updateVisuals(currentFluencySmooth, hnrDb);

            requestAnimationFrame(processLoop);
        }

        function updateVisuals(fluency, rawVal) {
            const percent = Math.round(fluency * 100);
            smoothPercentVal.textContent = percent;

            const minSize = 80;
            const maxSize = 250;
            const currentSize = minSize + (maxSize - minSize) * fluency;
            circle.style.width = currentSize + 'px';
            circle.style.height = currentSize + 'px';

            const hue = fluency * 120; // 0=Rojo, 60=Amarillo, 120=Verde
            const colorHSL = `hsl(${hue}, 85%, 50%)`;

            circle.style.backgroundColor = colorHSL;
            circle.style.boxShadow = `0 0 ${20 + fluency * 25}px ${colorHSL}`;

            progressBar.style.width = percent + '%';
            progressBar.style.backgroundColor = colorHSL;
            statusText.style.color = colorHSL;

            if (percent < 20) {
                statusText.textContent = "Voz Muy Constreñida (" + percent + "%)";
            } else if (percent < 50) {
                statusText.textContent = "Tensión Moderada (" + percent + "%)";
            } else if (percent < 80) {
                statusText.textContent = "Emisión Aceptable (" + percent + "%)";
            } else {
                statusText.textContent = "Voz Muy Fluida (" + percent + "%)";
            }
        }
    </script>
</body>
</html>
